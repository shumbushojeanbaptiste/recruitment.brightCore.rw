name: CI - test and publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u 0788644687 --password-stdin

      - name: Build backend image
        run: |
          docker build -t 0788644687/brightcore-api:${GITHUB_REF_NAME} -t 0788644687/brightcore-api:latest -f Dockerfile .

      - name: Build frontend image
        run: |
          docker build -t 0788644687/brightcore-frontend:${GITHUB_REF_NAME} -t 0788644687/brightcore-frontend:latest -f ./frontend/Dockerfile ./frontend

      - name: Push images to Docker Hub
        run: |
          docker push 0788644687/brightcore-api:${GITHUB_REF_NAME}
          docker push 0788644687/brightcore-api:latest
          docker push 0788644687/brightcore-frontend:${GITHUB_REF_NAME}
          docker push 0788644687/brightcore-frontend:latest
