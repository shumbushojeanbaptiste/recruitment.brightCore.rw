name: Deploy to VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "CI - test and publish"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export APP_TAG="${{ github.ref_name || github.event.workflow_run.head_branch }}"
            export DOCKERHUB_USERNAME="0788644687"

            mkdir -p /opt/brightcore
            cd /opt/brightcore

            if [ ! -f .env ]; then
              echo "Missing /opt/brightcore/.env. Add the production environment file before deployment."
              exit 1
            fi

            docker login -u 0788644687 -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker compose -f docker-compose.yml ps
